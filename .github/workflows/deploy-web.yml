name: Deploy Flutter Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Create dart defines
        env:
          API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROXY_URL: ${{ vars.DEEPSEEK_PROXY_URL }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$PROXY_URL" ]; then
            echo "::warning::DeepSeek is disabled until DEEPSEEK_API_KEY or DEEPSEEK_PROXY_URL is configured."
          fi
          jq -n --arg apiKey "$API_KEY" --arg proxy "$PROXY_URL" \
            '{DEEPSEEK_API_KEY: $apiKey, DEEPSEEK_PROXY_URL: $proxy}' > dart_defines.json

      - name: Build web
        run: |
          flutter build web --release \
            --base-href="/${{ github.event.repository.name }}/" \
            --dart-define-from-file=dart_defines.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
